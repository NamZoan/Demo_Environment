services:
  db:
    build:
      context: ./db
    environment:
      POSTGRES_DB: environment
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d environment"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://monitor:monitor@db:5432/environment
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ftp-server:
    image: fauria/vsftpd
    environment:
      FTP_USER: station
      FTP_PASS: stationpass
      PASV_ADDRESS: ftp-server
      PASV_MIN_PORT: 21100
      PASV_MAX_PORT: 21110
      LOCAL_UMASK: "022"
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - ftp_data:/home/vsftpd/station

  ftp-worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgresql://monitor:monitor@db:5432/environment
      FTP_INCOMING_DIR: /ftp/data
      FTP_ARCHIVE_DIR: /ftp/archive
      FTP_ERROR_DIR: /ftp/error
      POLL_SECONDS: 5
    volumes:
      - ftp_data:/ftp
    depends_on:
      db:
        condition: service_healthy

  iot-simulator:
    build:
      context: ./iot-simulator
    environment:
      FTP_HOST: ftp-server
      FTP_PORT: 21
      FTP_USER: station
      FTP_PASSWORD: stationpass
      REMOTE_BASE_DIR: /data
      SENSOR_COUNT: 100
      INTERVAL_SECONDS: 60
      LOCAL_OUTBOX_DIR: /tmp/iot-outbox
      UPLOAD_RETRIES: 3
      RETRY_BACKOFF_SECONDS: 3
      FTP_PASSIVE_MODE: "true"
      LOG_LEVEL: INFO
    depends_on:
      - ftp-server

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  ftp_data:
