services:
  db:
    build:
      context: ./db
    environment:
      POSTGRES_DB: environment
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d environment"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://monitor:monitor@db:5432/environment
      FTP_CREDENTIALS_KEY: development-only-change-me
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ftp-server:
    image: fauria/vsftpd
    environment:
      FTP_USER: station
      FTP_PASS: stationpass
      PASV_ADDRESS: 161.248.81.149
      PASV_MIN_PORT: 21100
      PASV_MAX_PORT: 21110
      LOCAL_UMASK: "022"
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - ftp_data:/home/vsftpd/station

  ftp-server-2:
    image: fauria/vsftpd
    environment:
      FTP_USER: station2
      FTP_PASS: stationpass2
      PASV_ADDRESS: 161.248.81.149
      PASV_MIN_PORT: 21111
      PASV_MAX_PORT: 21120
      LOCAL_UMASK: "022"
    ports:
      - "2121:21"
      - "21111-21120:21111-21120"
    volumes:
      - ftp_data_2:/home/vsftpd/station2

  ftp-server-3:
    image: fauria/vsftpd
    environment:
      FTP_USER: station3
      FTP_PASS: stationpass3
      PASV_ADDRESS: 161.248.81.149
      PASV_MIN_PORT: 21121
      PASV_MAX_PORT: 21130
      LOCAL_UMASK: "022"
    ports:
      - "2122:21"
      - "21121-21130:21121-21130"
    volumes:
      - ftp_data_3:/home/vsftpd/station3

  ftp-server-4:
    image: fauria/vsftpd
    environment:
      FTP_USER: station4
      FTP_PASS: stationpass4
      PASV_ADDRESS: 161.248.81.149
      PASV_MIN_PORT: 21131
      PASV_MAX_PORT: 21140
      LOCAL_UMASK: "022"
    ports:
      - "2123:21"
      - "21131-21140:21131-21140"
    volumes:
      - ftp_data_4:/home/vsftpd/station4

  ftp-server-5:
    image: fauria/vsftpd
    environment:
      FTP_USER: station5
      FTP_PASS: stationpass5
      PASV_ADDRESS: 161.248.81.149
      PASV_MIN_PORT: 21141
      PASV_MAX_PORT: 21150
      LOCAL_UMASK: "022"
    ports:
      - "2124:21"
      - "21141-21150:21141-21150"
    volumes:
      - ftp_data_5:/home/vsftpd/station5

  ftp-worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgresql://monitor:monitor@db:5432/environment
      FTP_CREDENTIALS_KEY: development-only-change-me
      FTP_INCOMING_DIR: /ftp/data
      FTP_ARCHIVE_DIR: /ftp/archive
      FTP_ERROR_DIR: /ftp/error
      POLL_SECONDS: 5
      ARCHIVE_PROCESSED_FILES: "false"
    volumes:
      - ftp_data:/ftp
    depends_on:
      db:
        condition: service_healthy

  ftp-worker-2:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgresql://monitor:monitor@db:5432/environment
      FTP_CREDENTIALS_KEY: development-only-change-me
      FTP_INCOMING_DIR: /ftp/data
      FTP_ARCHIVE_DIR: /ftp/archive
      FTP_ERROR_DIR: /ftp/error
      POLL_SECONDS: 5
      ARCHIVE_PROCESSED_FILES: "false"
    volumes:
      - ftp_data_2:/ftp
    depends_on:
      db:
        condition: service_healthy

  ftp-worker-3:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgresql://monitor:monitor@db:5432/environment
      FTP_CREDENTIALS_KEY: development-only-change-me
      FTP_INCOMING_DIR: /ftp/data
      FTP_ARCHIVE_DIR: /ftp/archive
      FTP_ERROR_DIR: /ftp/error
      POLL_SECONDS: 5
      ARCHIVE_PROCESSED_FILES: "false"
    volumes:
      - ftp_data_3:/ftp
    depends_on:
      db:
        condition: service_healthy

  ftp-worker-4:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgresql://monitor:monitor@db:5432/environment
      FTP_CREDENTIALS_KEY: development-only-change-me
      FTP_INCOMING_DIR: /ftp/data
      FTP_ARCHIVE_DIR: /ftp/archive
      FTP_ERROR_DIR: /ftp/error
      POLL_SECONDS: 5
      ARCHIVE_PROCESSED_FILES: "false"
    volumes:
      - ftp_data_4:/ftp
    depends_on:
      db:
        condition: service_healthy

  ftp-worker-5:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgresql://monitor:monitor@db:5432/environment
      FTP_CREDENTIALS_KEY: development-only-change-me
      FTP_INCOMING_DIR: /ftp/data
      FTP_ARCHIVE_DIR: /ftp/archive
      FTP_ERROR_DIR: /ftp/error
      POLL_SECONDS: 5
      ARCHIVE_PROCESSED_FILES: "false"
    volumes:
      - ftp_data_5:/ftp
    depends_on:
      db:
        condition: service_healthy

  iot-simulator-1:
    build:
      context: ./iot-simulator
    environment:
      FTP_HOST: ftp-server
      FTP_PORT: 21
      FTP_USER: station
      FTP_PASSWORD: stationpass
      REMOTE_BASE_DIR: /data
      SENSOR_START: 1
      SENSOR_COUNT: 2
      INTERVAL_SECONDS: 900
      LOCAL_OUTBOX_DIR: /tmp/iot-outbox
      UPLOAD_RETRIES: 3
      RETRY_BACKOFF_SECONDS: 3
      FTP_PASSIVE_MODE: "true"
      LOG_LEVEL: INFO
    depends_on:
      - ftp-server

  iot-simulator-2:
    build:
      context: ./iot-simulator
    environment:
      FTP_HOST: ftp-server-2
      FTP_PORT: 21
      FTP_USER: station2
      FTP_PASSWORD: stationpass2
      REMOTE_BASE_DIR: /data
      SENSOR_START: 3
      SENSOR_COUNT: 2
      INTERVAL_SECONDS: 900
      LOCAL_OUTBOX_DIR: /tmp/iot-outbox
      UPLOAD_RETRIES: 3
      RETRY_BACKOFF_SECONDS: 3
      FTP_PASSIVE_MODE: "true"
      LOG_LEVEL: INFO
    depends_on:
      - ftp-server-2

  iot-simulator-3:
    build:
      context: ./iot-simulator
    environment:
      FTP_HOST: ftp-server-3
      FTP_PORT: 21
      FTP_USER: station3
      FTP_PASSWORD: stationpass3
      REMOTE_BASE_DIR: /data
      SENSOR_START: 5
      SENSOR_COUNT: 2
      INTERVAL_SECONDS: 900
      LOCAL_OUTBOX_DIR: /tmp/iot-outbox
      UPLOAD_RETRIES: 3
      RETRY_BACKOFF_SECONDS: 3
      FTP_PASSIVE_MODE: "true"
      LOG_LEVEL: INFO
    depends_on:
      - ftp-server-3

  iot-simulator-4:
    build:
      context: ./iot-simulator
    environment:
      FTP_HOST: ftp-server-4
      FTP_PORT: 21
      FTP_USER: station4
      FTP_PASSWORD: stationpass4
      REMOTE_BASE_DIR: /data
      SENSOR_START: 7
      SENSOR_COUNT: 2
      INTERVAL_SECONDS: 900
      LOCAL_OUTBOX_DIR: /tmp/iot-outbox
      UPLOAD_RETRIES: 3
      RETRY_BACKOFF_SECONDS: 3
      FTP_PASSIVE_MODE: "true"
      LOG_LEVEL: INFO
    depends_on:
      - ftp-server-4

  iot-simulator-5:
    build:
      context: ./iot-simulator
    environment:
      FTP_HOST: ftp-server-5
      FTP_PORT: 21
      FTP_USER: station5
      FTP_PASSWORD: stationpass5
      REMOTE_BASE_DIR: /data
      SENSOR_START: 9
      SENSOR_COUNT: 2
      INTERVAL_SECONDS: 900
      LOCAL_OUTBOX_DIR: /tmp/iot-outbox
      UPLOAD_RETRIES: 3
      RETRY_BACKOFF_SECONDS: 3
      FTP_PASSIVE_MODE: "true"
      LOG_LEVEL: INFO
    depends_on:
      - ftp-server-5

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  ftp_data:
  ftp_data_2:
  ftp_data_3:
  ftp_data_4:
  ftp_data_5:
